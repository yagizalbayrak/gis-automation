<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autonomous GIS Workbench</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="layout">
    <section class="panel" id="panel">
      <header class="panel-header">
        <div class="header-row">
          <h1>Autonomous GIS Workbench</h1>
          <button id="settings-toggle" type="button" title="LLM settings">&#9881;</button>
        </div>
        <p class="subtitle">Natural-language geospatial automation &middot; deterministic &middot; auditable</p>
        <p id="ai-status" class="ai-status">AI: checking&hellip;</p>
      </header>

      <div id="settings-card" class="card hidden">
        <h2>AI model connection</h2>
        <div class="settings-grid">
          <label for="llm-provider">Provider</label>
          <select id="llm-provider"></select>

          <label for="llm-model">Model</label>
          <select id="llm-model"></select>

          <label for="llm-model-custom" id="llm-model-custom-label" class="hidden">Model id</label>
          <input id="llm-model-custom" class="hidden"
                 placeholder="any LiteLLM model id, e.g. gemini/gemini-2.5-flash" />

          <label for="llm-key">API key</label>
          <input id="llm-key" type="password" autocomplete="off"
                 placeholder="paste your API key" />

          <label for="llm-base" id="llm-base-label" class="hidden">API base URL</label>
          <input id="llm-base" class="hidden" placeholder="optional custom endpoint" />
        </div>
        <div class="settings-actions">
          <button id="llm-save">Save</button>
          <button id="llm-test" class="secondary">Test connection</button>
        </div>
        <p id="llm-feedback" class="llm-feedback"></p>
      </div>

      <div class="task-box">
        <textarea id="task-input" rows="3"
          placeholder='e.g. Kutahya&#39;daki "Ataturk Caddesi" icin 25 m buffer uygula'></textarea>
        <div id="examples">
          <button type="button" class="example-chip"
            data-text='Kutahya&#39;daki "Ataturk Caddesi" icin 25 m buffer uygula'>Street buffer (TR)</button>
          <button type="button" class="example-chip"
            data-text="Kutahya Evliya Celebi Mahallesi'nde okula 500 m, ana yollara 250 m mesafede kiralik ev icin uygun alanlari bul">Rental site search (TR)</button>
          <button type="button" class="example-chip"
            data-text="Kutahya'daki tum yollari haritaya cek">Fetch roads (TR)</button>
        </div>
        <button id="run-btn">Run</button>
      </div>

      <div id="status-row" class="hidden">
        <span id="status-chip" class="chip"></span>
        <span id="workflow-name" class="workflow-name"></span>
      </div>

      <div id="understood" class="card hidden">
        <h2>Understood</h2>
        <div id="understood-body"></div>
      </div>

      <div id="questions" class="card hidden">
        <h2>Needs your input</h2>
        <form id="questions-form"></form>
        <button id="answer-btn">Answer &amp; run</button>
      </div>

      <div id="error-box" class="card error hidden">
        <h2>Error</h2>
        <div id="error-body"></div>
      </div>

      <div id="plan-card" class="card hidden">
        <h2>Composed plan</h2>
        <ol id="plan-list"></ol>
      </div>

      <div id="trace-card" class="card hidden">
        <h2>Process trace</h2>
        <ol id="trace-list"></ol>
      </div>

      <div id="outputs-card" class="card hidden">
        <h2>Outputs</h2>
        <ul id="outputs-list"></ul>
      </div>

      <div id="report-card" class="card hidden">
        <h2>Report
          <span class="lang-toggle">
            <button type="button" class="lang-btn active" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="tr">TR</button>
          </span>
        </h2>
        <pre id="report-body"></pre>
      </div>
    </section>

    <section class="map-wrap">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
